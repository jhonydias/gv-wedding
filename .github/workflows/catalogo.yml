name: Catálogo

# Task 17: os noivos criam, editam e apagam presentes pela tela /noivos/presentes, que
# grava na planilha. Este workflow confere a cada 10 min se o catálogo da planilha mudou
# em relação ao publicado e, só se mudou, dispara o deploy.
#
# Separado do deploy.yml de propósito: lá o concurrency tem cancel-in-progress, e uma
# verificação agendada cancelaria um deploy de push em andamento.
#
# O GitHub atrasa cron com frequência (10 a 30 min) e DESLIGA workflow agendado de
# repositório público sem commit há 60 dias. Se os presentes pararem de aparecer
# sozinhos, é a primeira coisa a olhar (Actions → Catálogo → Enable workflow).

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  # Mudou a própria verificação: roda uma vez para provar que funciona no runner.
  push:
    branches: [main]
    paths:
      - .github/workflows/catalogo.yml
      - tools/catalogo.mjs

permissions:
  actions: write
  contents: read

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Diagnóstico por outra pilha de rede. Sai como anotação do job, legível pela API
      # pública sem abrir o log. Não bloqueia nada.
      - name: Diagnóstico de rede
        continue-on-error: true
        run: |
          curl -sSL -o /dev/null --max-time 60 \
            -w "::notice::curl catalogo: HTTP %{http_code} em %{time_total}s (dns %{time_namelookup}s, conexao %{time_connect}s, redirects %{num_redirects}, ip %{remote_ip})\n" \
            "$PUBLIC_BACKEND_URL?acao=catalogo" || echo "::warning::curl catalogo falhou (codigo $?)"
        env:
          PUBLIC_BACKEND_URL: ${{ secrets.PUBLIC_BACKEND_URL }}

      # Só o catalogo.mjs (sem dependências, sem imagens): é leitura e comparação.
      # Falhar aqui não pinta o workflow de vermelho a cada 10 min (e-mail a cada 10
      # min); vira aviso, e a comparação é pulada.
      - name: Ler a planilha
        id: ler
        continue-on-error: true
        run: node tools/catalogo.mjs
        env:
          PUBLIC_BACKEND_URL: ${{ secrets.PUBLIC_BACKEND_URL }}

      - name: Comparar com o publicado
        id: comparar
        if: steps.ler.outcome == 'success'
        run: |
          local=$(sha256sum src/data/catalogo.json | cut -c1-64)
          remoto=$(curl -fsS "https://giseleevictor.com.br/catalogo-versao.txt?t=$(date +%s)" || echo nenhum)
          echo "planilha: $local"
          echo "no ar:    $remoto"
          if [ "$local" = "$remoto" ]; then
            echo "mudou=nao" >> "$GITHUB_OUTPUT"
          else
            echo "mudou=sim" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar
        if: steps.comparar.outputs.mudou == 'sim'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
