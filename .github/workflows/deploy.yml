name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # TS strict é gate, não sugestão.
      - name: Verificar tipos
        run: npm run check

      - name: Build
        run: npm run build
        env:
          PUBLIC_RSVP_ENDPOINT: ${{ secrets.PUBLIC_RSVP_ENDPOINT }}
          PUBLIC_PIX_CHAVE: ${{ secrets.PUBLIC_PIX_CHAVE }}
          PUBLIC_PIX_NOME: ${{ secrets.PUBLIC_PIX_NOME }}
          PUBLIC_PIX_CIDADE: ${{ secrets.PUBLIC_PIX_CIDADE }}

      # Orçamento de peso como gate. O runner é Linux e case-sensitive:
      # `Foto.JPG` referenciado como `foto.jpg` passa no Windows e quebra aqui.
      - name: Auditar orçamento de imagens
        run: node scripts/auditar.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
